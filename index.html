  <script>
    // URLS ADE DE BASE
    const DEFAULT_URLS = {
      "3A": "https://ade.univ-perp.fr/jsp/custom/modules/plannings/anonymous_cal.jsp?resources=15730&projectId=10&calType=ical",
      "4A": "https://ade.univ-perp.fr/jsp/custom/modules/plannings/anonymous_cal.jsp?resources=15731&projectId=10&calType=ical",
      "5A": "https://ade.univ-perp.fr/jsp/custom/modules/plannings/anonymous_cal.jsp?resources=15732&projectId=10&calType=ical"
    };

    let currentPromo = "3A";
    let eventsList = [];
    let currentMonday = getMonday(new Date());

    window.onload = function() {
      lucide.createIcons();
      loadConfigInputs();
      fetchADEData();
      setInterval(updateNowIndicator, 60000);
    };

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function changePromo() {
      currentPromo = document.getElementById('promo-select').value;
      fetchADEData();
    }

    function changeWeek(dir) {
      currentMonday.setDate(currentMonday.getDate() + (dir * 7));
      renderCalendar();
    }

    function resetToToday() {
      currentMonday = getMonday(new Date());
      renderCalendar();
    }

    function getPromoUrl(promo) {
      const saved = localStorage.getItem(`ade_url_${promo}`);
      return saved || DEFAULT_URLS[promo] || DEFAULT_URLS["3A"];
    }

    // RÉCUPÉRATION DU FLUX SANS BLOCAGE
    async function fetchADEData() {
      const url = getPromoUrl(currentPromo);
      const syncBadge = document.getElementById('sync-badge');
      syncBadge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30";
      syncBadge.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> Chargement...`;
      lucide.createIcons();

      // Utilisation de proxies CORS résilients
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];

      let rawData = null;

      for (let pUrl of proxies) {
        try {
          const res = await fetch(pUrl, { cache: 'no-cache' });
          if (res.ok) {
            const txt = await res.text();
            if (txt && txt.includes("BEGIN:VCALENDAR")) {
              rawData = txt;
              break;
            }
          }
        } catch (e) {}
      }

      if (rawData) {
        eventsList = parseICS(rawData);
        localStorage.setItem(`events_cache_${currentPromo}`, JSON.stringify(eventsList));
        syncBadge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        syncBadge.innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Connecté ADE (${currentPromo})`;
      } else {
        // Tentative de chargement du cache local
        const cached = localStorage.getItem(`events_cache_${currentPromo}`);
        if (cached) {
          eventsList = JSON.parse(cached);
          syncBadge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-500/20 text-indigo-300 border border-indigo-500/30";
          syncBadge.innerHTML = `<i data-lucide="database" class="w-3.5 h-3.5"></i> Cache local (${currentPromo})`;
        } else {
          syncBadge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30";
          syncBadge.innerHTML = `<i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Erreur réseau`;
        }
      }
      lucide.createIcons();
      renderCalendar();
    }

    // DECODEUR ICS TOLÉRANT & ULTRA FIABLE
    function parseICS(icsData) {
      const events = [];
      const lines = icsData.replace(/\r/g, '').split('\n');
      let inEvent = false;
      let currentEvent = {};

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Gestion du pliage de ligne ICS (line folding)
        while (i + 1 < lines.length && (lines[i + 1].startsWith(' ') || lines[i + 1].startsWith('\t'))) {
          line += lines[i + 1].substring(1);
          i++;
        }

        if (line.startsWith('BEGIN:VEVENT')) {
          inEvent = true;
          currentEvent = {};
        } else if (line.startsWith('END:VEVENT')) {
          inEvent = false;
          if (currentEvent.start && currentEvent.end) {
            events.push(currentEvent);
          }
        } else if (inEvent) {
          if (line.startsWith('SUMMARY:')) {
            currentEvent.title = cleanText(line.substring(8));
          } else if (line.startsWith('LOCATION:')) {
            currentEvent.location = cleanText(line.substring(9)) || 'Salle non définie';
          } else if (line.startsWith('DESCRIPTION:')) {
            const desc = cleanText(line.substring(12));
            currentEvent.teacher = extractTeacher(desc);
            currentEvent.type = detectType(currentEvent.title || '', desc);
          } else if (line.startsWith('DTSTART')) {
            currentEvent.start = parseICSDate(line.split(':')[1]);
          } else if (line.startsWith('DTEND')) {
            currentEvent.end = parseICSDate(line.split(':')[1]);
          }
        }
      }
      return events;
    }

    function cleanText(str) {
      return str.replace(/\\,/g, ',').replace(/\\n/g, ' ').replace(/\\;/g, ';').trim();
    }

    function parseICSDate(dtStr) {
      if (!dtStr) return null;
      const c = dtStr.replace(/[^0-9T]/g, '');
      if (c.length < 15) return null;
      const y = parseInt(c.substr(0, 4));
      const m = parseInt(c.substr(4, 2)) - 1;
      const d = parseInt(c.substr(6, 2));
      const h = parseInt(c.substr(9, 2));
      const min = parseInt(c.substr(11, 2));
      return new Date(Date.UTC(y, m, d, h, min));
    }

    function extractTeacher(desc) {
      if (!desc) return '';
      const parts = desc.split(' ');
      return parts.length > 2 ? parts.slice(0, 3).join(' ') : desc;
    }

    function detectType(title, desc) {
      const full = (title + ' ' + desc).toUpperCase();
      if (full.includes('EXAM') || full.includes('DS') || full.includes('EVALUATION')) return 'EXAM';
      if (full.includes('TP')) return 'TP';
      if (full.includes('TD')) return 'TD';
      return 'CM';
    }

    // RENDU DE L'EMPLOI DU TEMPS
    function renderCalendar() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const filter = document.getElementById('type-filter').value;
      const todayStr = new Date().toDateString();

      const friday = new Date(currentMonday);
      friday.setDate(friday.getDate() + 4);
      document.getElementById('current-date-range').innerText = 
        `${currentMonday.toLocaleDateString('fr-FR', {day:'numeric', month:'short'})} - ${friday.toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}`;

      for (let d = 0; d < 5; d++) {
        const colDate = new Date(currentMonday);
        colDate.setDate(colDate.getDate() + d);

        const header = document.getElementById(`day-header-${d}`);
        const col = document.getElementById(`col-day-${d}`);
        col.innerHTML = '';

        const isToday = (colDate.toDateString() === todayStr);

        if (isToday) {
          header.className = "py-2 border-r border-slate-200 flex-1 font-bold bg-indigo-100 text-indigo-900 border-b-2 border-b-indigo-600";
          header.innerText = `${colDate.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric'})}`;
          col.className = "relative flex-1 h-[600px] bg-indigo-50/20";
        } else {
          header.className = "py-2 border-r border-slate-200 flex-1";
          header.innerText = colDate.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric'});
          col.className = "relative flex-1 h-[600px] bg-white";
        }
      }

      eventsList.forEach(ev => {
        if (!ev.start || !ev.end) return;
        const start = new Date(ev.start);
        const end = new Date(ev.end);

        if (filter !== 'ALL' && ev.type !== filter) return;
        if (search && !ev.title?.toLowerCase().includes(search) && !ev.location?.toLowerCase().includes(search)) return;

        const dayDiff = Math.floor((start - currentMonday) / (1000 * 60 * 60 * 24));
        if (dayDiff >= 0 && dayDiff < 5) {
          const col = document.getElementById(`col-day-${dayDiff}`);
          if (!col) return;

          const startHour = start.getHours() + (start.getMinutes() / 60);
          const endHour = end.getHours() + (end.getMinutes() / 60);

          const top = Math.max(0, (startHour - 8) * 50);
          const height = Math.max(22, (endHour - startHour) * 50);

          const card = document.createElement('div');
          card.style.top = `${top}px`;
          card.style.height = `${height}px`;
          card.className = `absolute left-0.5 right-0.5 p-1 rounded border text-[10.5px] leading-tight overflow-hidden shadow-xs cursor-pointer ${getBadgeStyle(ev.title, ev.type)}`;

          
          card.innerHTML = `
            <div class="font-bold truncate">${ev.title || 'Cours'}</div>
            <div class="flex items-center justify-between text-[9.5px] opacity-90">
              <span>${start.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})} - ${end.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</span>
              <span class="font-semibold bg-white/60 px-1 rounded text-[9px]">${ev.location}</span>
            </div>
          `;
          col.appendChild(card);
        }
      });

      updateNowIndicator();
    }

    
  // Génère une couleur pastel unique à partir du nom du cours
function getBadgeStyle(title, type) {
  // Les examens restent strictement en rouge
  if (type === 'EXAM') {
    return 'bg-rose-100 border-rose-400 text-rose-900 font-bold';
  }

  if (!title) return 'bg-slate-100 border-slate-300 text-slate-900';

  // Palette de teintes pastel distinctes pour les matières
  const palette = [
    'bg-sky-100 border-sky-300 text-sky-900',
    'bg-emerald-100 border-emerald-300 text-emerald-900',
    'bg-amber-100 border-amber-300 text-amber-900',
    'bg-violet-100 border-violet-300 text-violet-900',
    'bg-teal-100 border-teal-300 text-teal-900',
    'bg-indigo-100 border-indigo-300 text-indigo-900',
    'bg-orange-100 border-orange-300 text-orange-900',
    'bg-fuchsia-100 border-fuchsia-300 text-fuchsia-900',
    'bg-lime-100 border-lime-300 text-lime-900',
    'bg-cyan-100 border-cyan-300 text-cyan-900'
  ];

  // Nettoyage du titre pour regrouper CM/TD/TP d'une même matière sous la même couleur
  const cleanTitle = title.replace(/\b(CM|TD|TP|EXAM|EVALUATION|DS)\b/gi, '').trim().toUpperCase();

  // Algorithme de hachage simple pour associer toujours la même couleur au même nom
  let hash = 0;
  for (let i = 0; i < cleanTitle.length; i++) {
    hash = cleanTitle.charCodeAt(i) + ((hash << 5) - hash);
  }

  const index = Math.abs(hash) % palette.length;
  return palette[index];
}

    function updateNowIndicator() {
      const old = document.getElementById('now-indicator');
      if (old) old.remove();

      const now = new Date();
      const dayDiff = Math.floor((now - currentMonday) / (1000 * 60 * 60 * 24));

      if (dayDiff >= 0 && dayDiff < 5) {
        const col = document.getElementById(`col-day-${dayDiff}`);
        if (!col) return;

        const currentHour = now.getHours() + (now.getMinutes() / 60);
        if (currentHour >= 8 && currentHour <= 20) {
          const top = (currentHour - 8) * 50;
          const indicator = document.createElement('div');
          indicator.id = 'now-indicator';
          indicator.className = 'now-indicator';
          indicator.style.top = `${top}px`;
          indicator.innerHTML = `<div class="no
